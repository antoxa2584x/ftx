[package]
name = "ftx"
version = "0.1.0"
edition = "2024"
license = "PolyForm-Noncommercial-1.0.0"
repository = "https://github.com/antoxa2584x/ftx"
description = "Resumable, chunk-verified file transfer between two PCs - with a simple UI, UPnP and NAT-friendly reverse connections"

[dependencies]
blake3 = "1"
clap = { version = "4", features = ["derive", "env"] }
eframe = "0.37.0"
globset = "0.4"
igd-next = "0.18.0"
rfd = "0.18.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"

[build-dependencies]
winresource = "0.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_Console"] }

[profile.release]
lto = true
strip = true
