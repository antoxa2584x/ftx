name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: ubuntu-22.04 # older glibc = runs on more distros
            name: linux
          - os: macos-latest
            name: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: ${{ matrix.name == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --release -- -D warnings

      - name: Build (Windows)
        if: matrix.name == 'windows'
        shell: bash
        run: |
          cargo build --release
          mkdir dist
          cp target/release/ftx.exe dist/ftx-windows-x86_64.exe

      - name: Build (Linux)
        if: matrix.name == 'linux'
        run: |
          cargo build --release
          mkdir dist
          tar -czf dist/ftx-linux-x86_64.tar.gz -C target/release ftx

      - name: Build (macOS universal .app)
        if: matrix.name == 'macos'
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          APP=dist/ftx.app/Contents
          mkdir -p $APP/MacOS $APP/Resources
          lipo -create -output $APP/MacOS/ftx \
            target/aarch64-apple-darwin/release/ftx target/x86_64-apple-darwin/release/ftx
          # Icon: render every size iconutil wants from the 1024px PNG.
          ICONSET=$RUNNER_TEMP/ftx.iconset
          mkdir -p $ICONSET
          for s in 16 32 128 256 512; do
            sips -z $s $s assets/icon.png --out $ICONSET/icon_${s}x${s}.png >/dev/null
            sips -z $((s*2)) $((s*2)) assets/icon.png --out $ICONSET/icon_${s}x${s}@2x.png >/dev/null
          done
          iconutil -c icns $ICONSET -o $APP/Resources/ftx.icns
          VERSION=$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          cat > $APP/Info.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>ftx</string>
            <key>CFBundleDisplayName</key><string>ftx</string>
            <key>CFBundleIdentifier</key><string>io.github.antoxa2584x.ftx</string>
            <key>CFBundleExecutable</key><string>ftx</string>
            <key>CFBundleIconFile</key><string>ftx</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>$VERSION</string>
            <key>CFBundleVersion</key><string>$VERSION</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict></plist>
          PLIST
          # Ad-hoc signature so Apple Silicon runs it (still "unidentified developer").
          codesign --force --deep --sign - dist/ftx.app
          (cd dist && ditto -c -k --keepParent ftx.app ftx-macos-universal.zip && rm -rf ftx.app)

      - uses: actions/upload-artifact@v4
        with:
          name: ftx-${{ matrix.name }}
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
